<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      // Apply the saved color theme before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="../images/icon-180.png">
    <title>Gallery | Nathan Penny's personal website</title>
    <meta name="description" content="Image gallery for Nathan Penny's personal website.">
    <meta name="keywords" content="html,css,javascript,gallery,images">
    <meta name="author" content="Nathan Penny">
    <link rel="canonical" href="https://nathanpenny.fun/gallery">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nathan Penny's personal website">
    <meta property="og:title" content="Gallery | Nathan Penny's personal website">
    <meta property="og:description" content="Image gallery for Nathan Penny's personal website.">
    <meta property="og:url" content="https://nathanpenny.fun/gallery">
    <meta property="og:image" content="https://nathanpenny.fun/images/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link href="../styles/style.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="../NP-logo.svg">
    <link rel="alternate" type="application/rss+xml" title="Nathan Penny's blog (RSS)" href="https://nathanpenny.fun/feed.xml">
    <script src="../scripts/main.js" defer></script>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="../index.html" class="nav-brand" aria-label="Go to homepage">
          <img class="site-logo" src="../NP-logo.svg" alt="Nathan Penny logo">
          <div class="logo">Nathan Penny's personal website FOR FUN</div>
        </a>

        <ul class="nav-list">
          <li><a href="../index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./blog.html">Blog</a></li>
          <li><a href="./gallery.html">Gallery</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
        <button id="themeToggle" class="theme-toggle" type="button">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </div>
    </nav>

    <main class="container">
      <section class="hero">
        <h1>Gallery</h1>
        <p class="hero-subtitle">A collection of images, screenshots, and random visuals.</p>
      </section>

      <section class="gallery-section" aria-label="Image gallery">
        <div class="gallery-controls">
          <div class="gallery-filters" id="galleryFilters" role="group" aria-label="Filter images by category">
            <button class="filter-btn active" data-category="all" type="button">All</button>
          </div>
          <input
            class="gallery-search"
            id="gallerySearch"
            type="search"
            placeholder="Search images..."
            aria-label="Search images"
          >
        </div>

        <div class="gallery-grid" id="galleryGrid" role="list">
          <p class="gallery-loading">Loading gallery...</p>
        </div>

        <p class="gallery-empty" id="galleryEmpty" hidden>No images match your search.</p>
      </section>
    </main>

    <footer>
      <img class="footer-logo" src="../NP-logo.svg" alt="Nathan Penny logo">
      <p>&copy; 2026 Nathan Penny's personal website | based on HTML + CSS + JavaScript</p>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close preview"><i class="fa-solid fa-xmark"></i></button>
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-caption">
          <h3 id="lightboxTitle"></h3>
          <p id="lightboxDescription"></p>
        </div>
      </div>
      <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </body>
</html>
